name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Monthly rebuild keeps the prerendered default start month current.
  schedule:
    - cron: '0 3 1 * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup VP
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '26'
          cache: true

      - name: Build
        run: vp run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './apps/web/dist/client'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
